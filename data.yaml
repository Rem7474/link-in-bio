# Content source for the page. Loaded and parsed client-side (see
# vendor/js-yaml.min.js + main.js) — no build step.
#
# i18n: profile.bio and projects[].description accept either a plain
# string or a {fr, en} object for bilingual rendering (the site has a
# FR/EN switch, see main.js). pinned_repos[].description stays a plain
# string: it's auto-regenerated from the repo's GitHub description, in
# its original language.

profile:
  name: Rémy Cuvelier
  bio:
    fr: Apprenti Ingénieur avant-vente – Annecy, France. Spécialisé en SD-WAN et
      cybersécurité.
    en: Pre-sales engineering apprentice – Annecy, France. Focused on SD-WAN
      and cybersecurity.
  avatar: avatar.jpg
  links:
    - label: GitHub
      url: https://github.com/Rem7474
    - label: LinkedIn
      url: https://linkedin.com/in/remycuvelier/
    - label: Email
      url: mailto:remy.cuvelier@outlook.com

