# AUTOMATIC — this workflow owns data.yaml's "pinned_repos" key,
# docs/screenshots/preview.png, and favicon.png. Don't hand-edit any of
# them; they're overwritten on the next run. Hand-curated content lives
# in data.yaml's "projects" key instead, which this workflow never
# touches (the sync script edits pinned_repos in place via the `yaml`
# package's Document API, so comments elsewhere in the file survive).
name: Sync pinned projects, screenshot & favicon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    # Deliberately excludes data.yaml and docs/** — both are written by this
    # workflow's own commits, and including them would retrigger it on push.
    paths:
      - "index.html"
      - "styles.css"
      - "main.js"
      - "avatar.jpg"
      - "vendor/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PINNED_REPOS_TOKEN must be a classic PAT with the `read:user` scope —
      # the default GITHUB_TOKEN cannot query pinnedItems.
      - name: Sync pinned projects into data.yaml
        env:
          PINNED_REPOS_TOKEN: ${{ secrets.PINNED_REPOS_TOKEN }}
        run: npm run sync-pinned

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Refresh site screenshot
        run: npm run screenshot

      - name: Regenerate favicon
        run: npm run favicon

      - name: Commit changes if data.yaml, screenshot, or favicon updated
        run: |
          if git diff --quiet -- data.yaml docs/screenshots/preview.png favicon.png; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.yaml docs/screenshots/preview.png favicon.png
            git commit -m "chore: sync pinned projects, refresh screenshot and favicon"
            git push
          fi
