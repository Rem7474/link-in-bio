name: Sync pinned projects

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # PINNED_REPOS_TOKEN must be a classic PAT with the `read:user` scope —
      # the default GITHUB_TOKEN cannot query pinnedItems.
      - name: Sync pinned projects into data.json
        env:
          PINNED_REPOS_TOKEN: ${{ secrets.PINNED_REPOS_TOKEN }}
        run: node scripts/sync-pinned-projects.mjs

      - name: Commit changes if data.json updated
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: sync pinned projects from GitHub"
            git push
          fi
