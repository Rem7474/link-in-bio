name: Pages check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data.json
        run: node -e "JSON.parse(require('fs').readFileSync('data.json', 'utf8'))"

      - name: Check required files
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f styles.css || (echo "styles.css missing" && exit 1)
          test -f main.js || (echo "main.js missing" && exit 1)
          test -f data.json || (echo "data.json missing" && exit 1)
