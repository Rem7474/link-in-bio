<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Rémy Cuvelier – Liens &amp; Projets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Rémy Cuvelier, apprenti ingénieur avant-vente spécialisé en SD-WAN et cybersécurité. Retrouvez mes liens et mes projets (ServerSupervisor, comparateur électricité, CarsTCO)." />
  <link rel="canonical" href="https://remcorp.fr/" />

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Rémy Cuvelier – Liens &amp; Projets" />
  <meta property="og:description" content="Apprenti ingénieur avant-vente – Annecy, France. Spécialisé en SD-WAN et cybersécurité." />
  <meta property="og:image" content="https://remcorp.fr/avatar.jpg" />
  <meta property="og:url" content="https://remcorp.fr/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Rémy Cuvelier – Liens &amp; Projets" />
  <meta name="twitter:description" content="Apprenti ingénieur avant-vente – Annecy, France. Spécialisé en SD-WAN et cybersécurité." />
  <meta name="twitter:image" content="https://remcorp.fr/avatar.jpg" />

  <link rel="icon" href="avatar.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="avatar.jpg" />

  <link rel="stylesheet" href="styles.css" />
  <noscript>
    <style>.fade-up { opacity: 1 !important; transform: none !important; }</style>
  </noscript>
</head>
<body>
  <main class="page">

    <!-- Profile / Links: the static content below must stay in sync with data.yaml (no-JS fallback + anti-CLS) -->
    <section class="profile-section fade-up">
      <div class="profile-card fade-up">
        <img id="avatar" src="avatar.jpg" alt="Photo de profil" class="avatar" width="104" height="104" />

        <h1 id="name" class="name fade-up">Rémy Cuvelier</h1>
        <p id="bio" class="bio fade-up">Apprenti Ingénieur avant-vente – Annecy, France. Spécialisé en SD-WAN et cybersécurité.</p>

        <div id="links" class="links">
          <noscript>
            <a class="link" href="https://github.com/Rem7474" target="_blank" rel="noopener">GitHub</a>
            <a class="link" href="https://linkedin.com/in/remycuvelier/" target="_blank" rel="noopener">LinkedIn</a>
            <a class="link" href="mailto:remy.cuvelier@outlook.com">Email</a>
          </noscript>
        </div>
      </div>
    </section>

    <!-- Featured projects (hand-edited in data.yaml) -->
    <section class="projects-section fade-up">
      <h2 class="section-title fade-up" data-i18n="sectionProjects">Projets</h2>

      <div id="projects" class="projects-grid">
        <noscript>
          <p style="text-align:center;">Activez JavaScript pour voir la liste des projets. / Enable JavaScript to see the project list.</p>
        </noscript>
      </div>
    </section>

    <!-- GitHub pinned repositories (auto-synced, see scripts/sync-pinned-projects.mjs) -->
    <section class="projects-section fade-up">
      <h2 class="section-title fade-up" data-i18n="sectionPinned">Dépôts épinglés</h2>

      <div id="pinned-repos" class="projects-grid">
        <noscript>
          <p style="text-align:center;">Activez JavaScript pour voir la liste des dépôts épinglés. / Enable JavaScript to see the pinned repositories.</p>
        </noscript>
      </div>
    </section>

    <footer class="footer fade-up">
      <p id="footer-text">Rémy Cuvelier</p>
      <p class="footer-links">
        <a href="https://github.com/Rem7474/link-in-bio" target="_blank" rel="noopener" data-i18n="footerSource">Code source</a>
      </p>
    </footer>
  </main>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
