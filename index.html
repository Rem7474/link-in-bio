<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chargement…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Page personnelle – liens et projets." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">

    <!-- Profil / Liens -->
    <section class="profile-section fade-up">
      <div class="profile-card fade-up">
        <img id="avatar" alt="Photo de profil" class="avatar" />

        <h1 id="name" class="name fade-up"></h1>
        <p id="bio" class="bio fade-up"></p>

        <div id="links" class="links"></div>
      </div>
    </section>

    <!-- Projets -->
    <section class="projects-section fade-up">
      <h2 class="section-title fade-up">Projets &amp; Sites</h2>

      <div id="projects" class="projects-grid"></div>
    </section>

    <footer class="footer fade-up">
      <p id="footer-text"></p>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
